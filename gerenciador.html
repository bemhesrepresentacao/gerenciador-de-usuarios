<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gerenciador de Usuários | Marcão da Graxa</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#070A0F;--card:#0F172A;--blue:#0052D4;--green:#22C55E;--text:#F8FAFC;--muted:#94A3B8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Segoe UI,Arial,sans-serif}
.wrap{max-width:1100px;margin:auto;padding:28px 18px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}.brand img{width:54px;height:54px;object-fit:contain;border-radius:10px}
.card{background:var(--card);border:1px solid #1E293B;border-radius:16px;padding:24px;margin-bottom:18px}
h1,h2{margin-top:0}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
label{display:block;font-weight:600;margin-bottom:6px}input{width:100%;padding:12px;border-radius:9px;border:1px solid #334155;background:#070A0F;color:#fff}
button{border:0;border-radius:9px;padding:11px 16px;font-weight:700;cursor:pointer;margin:5px 5px 0 0}.primary{background:linear-gradient(90deg,var(--blue),var(--green));color:#fff}.secondary{background:#1e293b;color:#fff}.danger{background:#7f1d1d;color:#fff}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #263244}img.logo-preview{width:80px;height:60px;object-fit:contain;background:#fff;border-radius:8px}
.hidden{display:none}.status{padding:10px;border-radius:8px;margin:10px 0}.ok{background:#064e3b}.err{background:#7f1d1d}
</style></head>
<body><div class="wrap">
<div class="brand"><img src="https://bemhesrepresentacao.github.io/Marcao-da-Graxa/Marc%C3%A3o%20da%20Graxa%20foto.png"><div><h1>Gerenciador de Usuários</h1><div class="muted">Perfis, contatos e identidade visual do site</div></div></div>

<section id="login" class="card"><h2>Entrar</h2><p class="muted">Cada usuário entra com seu próprio e-mail e senha.</p>
<div class="grid"><div><label>E-mail</label><input id="email" type="email"></div><div><label>Senha</label><input id="password" type="password"></div></div>
<button class="primary" onclick="login()">Entrar</button><button class="secondary" onclick="signup()">Criar conta</button><div id="loginMsg"></div></section>

<section id="app" class="hidden">
<div class="card"><button class="secondary" onclick="logout()">Sair</button><button class="secondary" onclick="newProfile()">Novo perfil</button><span id="userLabel" class="muted"></span></div>
<div class="card"><h2>Perfil</h2><input id="profileId" type="hidden">
<div class="grid">
<div><label>Nome / empresa</label><input id="name"></div>
<div><label>Cidade / localização</label><input id="city"></div>
<div><label>E-mail público</label><input id="publicEmail" type="email"></div>
<div><label>Telefone / WhatsApp</label><input id="phone"></div>
<div><label>Logo (URL da imagem)</label><input id="logo"></div>
<div><label>URL do site</label><input id="siteUrl" placeholder="https://..."></div>
</div><div style="margin-top:14px"><img id="logoPreview" class="logo-preview" alt="Prévia da logo"></div>
<button class="primary" onclick="saveProfile()">Salvar alterações</button>
<button class="secondary" onclick="transfer()">Transferir para o site</button>
<button class="danger" onclick="deleteProfile()">Excluir perfil</button>
<div id="appMsg"></div></div>

<div class="card"><h2>Meus perfis</h2><div id="profiles"></div></div>
</section></div>
<script>
const SUPABASE_URL="COLOQUE_AQUI_A_URL_DO_SEU_SUPABASE";
const SUPABASE_ANON_KEY="COLOQUE_AQUI_A_CHAVE_ANON_DO_SEU_SUPABASE";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let current=null;
const $=id=>document.getElementById(id);
function msg(el,text,ok=true){$(el).innerHTML='<div class="status '+(ok?'ok':'err')+'">'+text+'</div>'}
async function login(){const {error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)msg('loginMsg',error.message,false);else load()}
async function signup(){const {error}=await sb.auth.signUp({email:$('email').value,password:$('password').value});if(error)msg('loginMsg',error.message,false);else msg('loginMsg','Conta criada. Se o Supabase exigir confirmação, confirme o e-mail antes de entrar.')}
async function logout(){await sb.auth.signOut();location.reload()}
async function load(){const {data:{user}}=await sb.auth.getUser();if(!user)return;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('userLabel').textContent='  '+user.email;await listProfiles()}
async function listProfiles(){const {data,error}=await sb.from('profiles').select('*').order('name');if(error){msg('appMsg',error.message,false);return} $('profiles').innerHTML=data.length?'<table><tr><th>Logo</th><th>Nome</th><th>Localização</th><th>Contato</th><th>Ação</th></tr>'+data.map(p=>`<tr><td><img class="logo-preview" src="${p.logo_url||''}"></td><td>${esc(p.name)}</td><td>${esc(p.city||'')}</td><td>${esc(p.phone||'')}<br>${esc(p.email||'')}</td><td><button class="secondary" onclick="editProfile('${p.id}')">Editar</button></td></tr>`).join('')+'</table>':'<p class="muted">Nenhum perfil cadastrado.</p>'}
async function editProfile(id){const {data,error}=await sb.from('profiles').select('*').eq('id',id).single();if(error)return msg('appMsg',error.message,false);current=data;$('profileId').value=data.id;$('name').value=data.name||'';$('city').value=data.city||'';$('publicEmail').value=data.email||'';$('phone').value=data.phone||'';$('logo').value=data.logo_url||'';$('siteUrl').value=data.site_url||'';$('logoPreview').src=data.logo_url||''}
function newProfile(){current=null;$('profileId').value='';['name','city','publicEmail','phone','logo','siteUrl'].forEach(x=>$(x).value='');$('logoPreview').src=''}
async function saveProfile(){const {data:{user}}=await sb.auth.getUser();if(!user)return;const row={user_id:user.id,name:$('name').value,city:$('city').value,email:$('publicEmail').value,phone:$('phone').value,logo_url:$('logo').value,site_url:$('siteUrl').value};let r=current?await sb.from('profiles').update(row).eq('id',current.id):await sb.from('profiles').insert(row);if(r.error)msg('appMsg',r.error.message,false);else{msg('appMsg','Perfil salvo com sucesso.');await listProfiles();}}
async function deleteProfile(){if(!current||!confirm('Excluir este perfil?'))return;const {error}=await sb.from('profiles').delete().eq('id',current.id);if(error)msg('appMsg',error.message,false);else{newProfile();await listProfiles();msg('appMsg','Perfil excluído.')}}
function transfer(){const obj={name:$('name').value,city:$('city').value,email:$('publicEmail').value,phone:$('phone').value,logo_url:$('logo').value,site_url:$('siteUrl').value};localStorage.setItem('siteProfile',JSON.stringify(obj));msg('appMsg','Dados preparados para o site. O site público, se configurado com o mesmo perfil no Supabase, será atualizado imediatamente.')}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
$('logo').addEventListener('input',e=>$('logoPreview').src=e.target.value);sb.auth.getSession().then(load);
</script></body></html>
